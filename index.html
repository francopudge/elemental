<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Dice Duel</title>
    <link rel="icon" type="image/png" href="cover.png">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-gold: #f1c40f;
            --accent-purple: #8e44ad;
            --accent-blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: url('cover.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('cover.png') no-repeat center center;
            background-size: contain;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
        }
        .loader {
            width: 80%; max-width: 200px; height: 8px;
            background: #333; border-radius: 5px; overflow: hidden; border: 1px solid #555;
        }
        .loader-fill {
            width: 0%; height: 100%; background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold); transition: width 0.3s;
        }

        #game-container {
            width: 95%;
            max-width: 900px;
            background: rgba(15, 15, 15, 0.94);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid #333;
            margin: auto;
        }

        .hidden { display: none !important; }

        .menu-btn {
            background: linear-gradient(to bottom, #444, #111);
            color: white; border: 2px solid #555;
            padding: 12px 20px; margin: 8px; cursor: pointer;
            font-size: 1.1em; border-radius: 8px; transition: 0.3s;
            min-width: 200px; font-weight: bold; text-transform: uppercase;
        }
        .menu-btn:hover:not(:disabled) { border-color: var(--accent-gold); color: var(--accent-gold); transform: scale(1.03); }
        .menu-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .music-ctrl {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .arena { 
            display: flex; flex-wrap: wrap; justify-content: space-around; 
            margin-top: 5px; padding: 10px;
            background-image: url('battle.png'); background-size: cover;
            background-position: center; border-radius: 12px; border: 2px solid #444;
            min-height: 300px;
        }

        .player-side { 
            width: 38%; padding: 8px; background: rgba(0,0,0,0.7); 
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }

        .hp-bar { 
            height: 50px; width: 100%; background-image: url('darah.png'); 
            background-size: contain; background-repeat: no-repeat;
            background-position: center; margin: 5px 0; position: relative; overflow: hidden;
        }
        .hp-fill { 
            height: 100%; background: rgba(200, 0, 0, 0.45); width: 100%; 
            transition: width 0.6s; float: right; mix-blend-mode: multiply;
        }

        .battle-img { width: 100%; max-height: 140px; object-fit: contain; filter: drop-shadow(0 0 8px black); }
        .dice-box { font-size: 3.5em; color: var(--accent-gold); text-shadow: 0 0 15px rgba(241, 196, 15, 0.6); }

        #log {
            height: 80px; overflow-y: auto; background: rgba(0,0,0,0.85);
            padding: 8px; text-align: left; font-size: 0.8em;
            margin-top: 10px; border-radius: 8px; border: 1px solid #444; color: #ccc;
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a1a1a; padding: 15px; border-radius: 10px;
            max-width: 85%; max-height: 85%; text-align: center;
            border: 2px solid var(--accent-gold);
        }
        .modal-content img { max-width: 100%; max-height: 400px; border-radius: 5px; object-fit: contain; }

        .char-card {
            display: inline-block; width: 130px; padding: 8px; margin: 6px;
            background: #1a1a1a; border: 2px solid #333; border-radius: 10px; cursor: pointer;
            font-size: 0.8em; vertical-align: top; transition: 0.2s;
            position: relative;
        }
        .char-card.selected { border-color: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold); }
        
        .char-card.disabled { 
            opacity: 0.4; cursor: not-allowed; filter: grayscale(1); pointer-events: none;
        }
        .char-card.disabled::after {
            content: "SUDAH DIPILIH";
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            background: rgba(255, 0, 0, 0.8); color: white;
            padding: 2px 5px; font-weight: bold; font-size: 0.8em; border-radius: 4px;
        }

        .monster-thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
        .skill-text {
            display: block; margin-top: 5px; font-size: 0.7em;
            color: #aaa; line-height: 1.2; font-style: italic;
        }

        @media (max-width: 600px) {
            .player-side { width: 45%; }
            .dice-section { order: 2; margin: 10px 0; }
            .char-card { width: 110px; }
            #game-container { padding: 15px; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h2 style="color:white; text-shadow: 2px 2px 4px #000; font-size: 1.2em;">Loading...</h2>
    <div class="loader"><div class="loader-fill" id="load-bar"></div></div>
</div>

<div id="rule-modal" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--accent-gold);">RULEBOOK</h3>
        <img src="rulebook.png" alt="Rulebook">
        <br>
        <button class="menu-btn" onclick="toggleRules()" style="min-width: 100px; margin-top:10px;">TUTUP</button>
    </div>
</div>

<div id="game-container" class="hidden">
    <div id="main-menu">
        <img src="cover.png" alt="Logo" style="width: 150px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);">
        <h1 style="margin: 10px 0; letter-spacing: 2px;">ELEMENTAL DICE DUEL</h1>
        <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
            <button class="menu-btn" onclick="startSelection('pvp')">Multiplayer</button>
            <button class="menu-btn" onclick="startSelection('pve')">VS AI</button>
            <button class="menu-btn" onclick="toggleRules()" style="background: linear-gradient(to bottom, #555, #222);">Rulebook</button>
        </div>
    </div>

    <div id="selection-screen" class="hidden">
        <h2 id="selection-title" style="font-size: 1.2em;">Pilih Monster Pemain 1</h2>
        <div id="monster-list" style="max-height: 400px; overflow-y: auto; margin-bottom: 10px; padding: 10px;"></div>
        <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button class="menu-btn" style="background: linear-gradient(to bottom, #777, #333); min-width: 120px;" onclick="backToLobby()">Kembali</button>
            <button class="menu-btn" id="confirm-btn" style="min-width: 120px;" onclick="confirmSelection()">Konfirmasi</button>
        </div>
    </div>

    <div id="battle-screen" class="hidden">
        <div style="display: flex; justify-content: flex-end;">
            <button class="music-ctrl" onclick="toggleMusic()">
                <span id="music-icon">▶️</span> <span id="music-text">Play Music</span>
            </button>
        </div>
        <audio id="bg-music" loop>
            <source src="MADAMVデュエルマスターズビクトリーMyビクトリー.mp3" type="audio/mpeg">
        </audio>

        <div class="arena">
            <div class="player-side">
                <h4 id="p1-name" style="margin: 5px 0;">P1</h4>
                <div id="p1-monster-img-box"></div>
                <div class="hp-bar"><div id="p1-hp-fill" class="hp-fill"></div></div>
                <div id="p1-hp-text" style="font-size: 0.8em;">HP: 10/10</div>
            </div>

            <div class="dice-section" style="width: auto; order: 2;">
                <div class="dice-box" id="dice-display">🎲</div>
                <h5 id="turn-indicator" style="margin: 5px 0;">GILIRAN P1</h5>
                <button class="menu-btn" id="roll-btn" onclick="handleRoll()" style="min-width: 80px; padding: 8px 15px;">ROLL!</button>
            </div>

            <div class="player-side">
                <h4 id="p2-name" style="margin: 5px 0;">P2</h4>
                <div id="p2-monster-img-box"></div>
                <div class="hp-bar"><div id="p2-hp-fill" class="hp-fill"></div></div>
                <div id="p2-hp-text" style="font-size: 0.8em;">HP: 10/10</div>
            </div>
        </div>
        <div id="log"></div>
    </div>
</div>

<script>
    const bgMusic = document.getElementById('bg-music');
    const musicIcon = document.getElementById('music-icon');
    const musicText = document.getElementById('music-text');

    function toggleMusic() {
        if (bgMusic.paused) {
            bgMusic.play().catch(e => console.log("Audio play blocked"));
            musicIcon.innerText = "⏸️"; musicText.innerText = "Pause";
        } else {
            bgMusic.pause();
            musicIcon.innerText = "▶️"; musicText.innerText = "Play";
        }
    }

    window.onload = () => {
        let progress = 0;
        const loadBar = document.getElementById('load-bar');
        const interval = setInterval(() => {
            progress += Math.random() * 25;
            if (progress > 100) progress = 100;
            loadBar.style.width = progress + '%';
            if(progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                }, 400);
            }
        }, 120);
    };

    function toggleRules() { document.getElementById('rule-modal').classList.toggle('hidden'); }

    const MONSTERS = [
        { id: 'ryusei', name: 'Ryusei', element: 'fire', color: '#ff4d4d', img: 'ryusei.png', skill: "Dragon's Scale: Jika terkena damage GENAP, serangan musuh di giliran berikutnya dipaksa meleset (Dadu dipaksa jadi 1)." },
        { id: 'dorballom', name: 'Dorballom', element: 'dark', color: '#8e44ad', img: 'dorballom.png', skill: ' Cursed Aura: Kurangi Max HP musuh.' },
        { id: 'grist', name: 'Grist', element: 'nature', color: '#27ae60', img: 'grist.png', skill: 'Thorn Burst: HP Ganjil beri 1 damage ke musuh. Tank: Kurangi 1 damage diterima.' },
        { id: 'bladewing', name: 'Bladewing', element: 'fire', color: '#c0392b', img: 'bladewing.png', skill: 'Overheat: Paksa serangan masuk (Ganjil jadi Hit) dengan bayar 1 HP sendiri.' },
        { id: 'aesi', name: 'Aesi', element: 'water', color: '#2980b9', img: 'aesi.png', skill: 'Reflective: Pantulkan 1 damage jika musuh Miss.' },
        { id: 'alphadios', name: 'Alphadios', element: 'light', color: '#f1c40f', img: 'alphadios.png', skill: 'Holy Pressure: Matikan skill musuh jika HP musuh lebih rendah darinya.' },
        { id: 'bynor', name: 'Bynor', element: 'water', color: '#3498db', img: 'bynor.png', skill: 'High Pressure: Selama HP lawan lebih tinggi, lawan wajib re-roll angka genap.' },
        { id: 'juranail', name: 'Juranail', element: 'nature', color: '#2ecc71', img: 'juranail.png', skill: 'Adaptive Roots: Jika HP lawan lebih tinggi, re-roll angka ganjil (1,3,5).' },
        { id: 'alpharion', name: 'Alpharion', element: 'light', color: '#fff176', img: 'alpharion.png', skill: 'Dual Wing Slash: Jika Genap, serang lagi. Jika Genap lagi, +1 Damage tambahan.' },
        { id: 'nekusar', name: 'Nekusar', element: 'dark', color: '#8e44ad', img: 'nekusar.png', skill: 'Night Reborn: Bangkit kembali dengan 4 HP saat HP mencapai 0 (1x per game).', rebornUsed: false },
        { id: 'shiden', name: 'Shiden', element: 'fire', color: '#ff4500', img: 'shiden.png', skill: 'Burning Soul: Jika HP-mu 4 atau kurang, setiap serangan berhasil (Genap) memberikan +1 Damage tambahan.' },
        { id: 'quake', name: 'Quake', element: 'nature', color: '#556b2f', img: 'quake.png', skill: 'Overgrowth: Selama HP-mu Genap, serangan berhasil memberikan +1 Damage tambahan.' },
        { id: 'emrakul', name: 'Emrakul', element: 'water', color: '#3498db', img: 'emrakul.png', skill: 'Abyssal Tide: Setiap kali pulih HP (Purify), serangan lawan berikutnya dikurangi -1 Damage.', abyssalShield: false },
        { id: 'zeron', name: 'Zeron', element: 'dark', color: '#8e44ad', img: 'zeron.png', skill: 'Soul Devourer: Jika HP lawan di bawah 5, serangan berhasil (Genap) memberi 3 Damage.' },
        { id: 'ulalek', name: 'Ulalek', element: 'light', color: '#f1c40f', img: 'ulalek.png', skill: 'Gaze of the Void: Jika Genap, musuh Lumpuh (Skip 1 turn). Sekali pakai, aktif lagi jika terkena damage.' },
        { id: 'deathbell', name: 'Deathbell', element: 'nature', color: '#2ecc71', img: 'deathbell.png', skill: 'Thousand-Eye Insight: Giliran lawan, lawan harus menebak angka. Jika musuh dapat GANJIL atau salah tebak, Re-Roll otomatis dipicu!' }
    ];

    let gameState = { mode: '', step: 0, p1: null, p2: null, turn: 1, isRolling: false, tempSelected: null };

    function backToLobby() {
        gameState.step = 0; gameState.p1 = null; gameState.p2 = null; gameState.tempSelected = null;
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function startSelection(mode) {
        gameState.mode = mode; gameState.step = 0; gameState.p1 = null; gameState.p2 = null;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
        document.getElementById('selection-title').innerText = "Pilih Monster Pemain 1";
        renderMonsters();
    }

    function renderMonsters() {
        const list = document.getElementById('monster-list');
        list.innerHTML = '';
        MONSTERS.forEach(m => {
            const isTaken = gameState.p1 && gameState.p1.id === m.id;
            const card = document.createElement('div');
            card.className = `char-card ${isTaken ? 'disabled' : ''}`;
            card.onclick = () => {
                if (isTaken) return;
                document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                gameState.tempSelected = m;
            };
            card.innerHTML = `
                <img src="${m.img}" class="monster-thumb" onerror="this.src='https://via.placeholder.com/80'">
                <div style="font-weight:bold; color:${m.color}">${m.name}</div>
                <span class="skill-text">${m.skill}</span>
            `;
            list.appendChild(card);
        });
    }

    function confirmSelection() {
        if (!gameState.tempSelected) return alert("Pilih monster!");
        if (gameState.step === 0) {
            gameState.p1 = { ...gameState.tempSelected, hp: 10, maxHp: 10, rebornUsed: false, abyssalShield: false, dragonScaleDebuff: false, skipTurn: false, skillActive: true };
            gameState.tempSelected = null;
            if (gameState.mode === 'pvp') {
                gameState.step = 1;
                document.getElementById('selection-title').innerText = "Pilih Monster Pemain 2";
                renderMonsters();
            } else {
                const available = MONSTERS.filter(m => m.id !== gameState.p1.id);
                gameState.p2 = { ...available[Math.floor(Math.random()*available.length)], hp: 10, maxHp: 10, rebornUsed: false, abyssalShield: false, dragonScaleDebuff: false, skipTurn: false, skillActive: true };
                startBattle();
            }
        } else {
            gameState.p2 = { ...gameState.tempSelected, hp: 10, maxHp: 10, rebornUsed: false, abyssalShield: false, dragonScaleDebuff: false, skipTurn: false, skillActive: true };
            startBattle();
        }
    }

    function startBattle() {
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.remove('hidden');
        document.getElementById('p1-name').innerText = gameState.p1.name;
        document.getElementById('p1-name').style.color = gameState.p1.color;
        document.getElementById('p1-monster-img-box').innerHTML = `<img src="${gameState.p1.img}" class="battle-img">`;
        document.getElementById('p2-name').innerText = gameState.p2.name;
        document.getElementById('p2-name').style.color = gameState.p2.color;
        document.getElementById('p2-monster-img-box').innerHTML = `<img src="${gameState.p2.img}" class="battle-img">`;
        updateUI();
    }

    function handleRoll() {
        if (gameState.isRolling) return;
        
        let attacker = gameState.turn === 1 ? gameState.p1 : gameState.p2;
        let defender = gameState.turn === 1 ? gameState.p2 : gameState.p1;
        let skillMati = (defender.id === 'alphadios' && attacker.hp < defender.hp);

        // Logic Tebakan Deathbell
        let userGuess = null;
        if (defender.id === 'deathbell' && !skillMati) {
            if (gameState.mode === 'pve' && gameState.turn === 2) {
                userGuess = Math.random() < 0.5 ? "ganjil" : "genap";
                addLog(`AI menebak: ${userGuess.toUpperCase()}`);
            } else {
                let input = prompt(`Thousand-Eye Insight! Tebak angka dadumu (Ganjil/Genap):`);
                if (!input) input = "ganjil";
                userGuess = input.toLowerCase();
            }
        }

        gameState.isRolling = true;
        const diceEl = document.getElementById('dice-display');
        diceEl.innerText = "🎲";

        setTimeout(() => {
            let roll = Math.floor(Math.random() * 6) + 1;
// Efek Deathbell (FINAL FIX)
if (userGuess && !skillMati) {
    let isEven = (roll % 2 === 0);
    let guessedCorrect = (userGuess === "genap" && isEven) || (userGuess === "ganjil" && !isEven);

    if (!guessedCorrect) {
        addLog(`Thousand-Eye Insight: Tebakan SALAH! Serangan gagal total.`);
        roll = 1; // miss
    } else {
        addLog(`Thousand-Eye Insight: Tebakan BENAR!`);

        // 🔥 KUNCI: kalau tebak GANJIL & hasil GANJIL → tetap dianggap HIT
        if (userGuess === "ganjil" && !isEven) {
            addLog(`Insight: Serangan ganjil dipaksa menjadi HIT!`);
            roll = 2; // paksa genap supaya masuk sistem HIT
        }
    }
}
            finalizeRollProcess(roll, attacker, defender, skillMati, diceEl);
        }, 600);
    }

    function finalizeRollProcess(roll, attacker, defender, skillMati, diceEl) {
        if (attacker.dragonScaleDebuff && !skillMati) {
            if (roll % 2 === 0) {
                roll = 1; 
                addLog(`Dragon's Scale: Dadu ${attacker.name} dipaksa jadi 1!`);
            }
            attacker.dragonScaleDebuff = false; 
        }

        if (defender.id === 'bynor' && attacker.hp > defender.hp && roll % 2 === 0 && !skillMati) {
            addLog(`High Pressure! ${defender.name} memaksa ${attacker.name} re-roll.`);
            diceEl.innerText = "🔄";
            setTimeout(() => {
                roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;
                processTurn(roll);
            }, 600);
        } 
        else if (attacker.id === 'juranail' && defender.hp > attacker.hp && roll % 2 !== 0 && !skillMati) {
            addLog(`Adaptive Roots! ${attacker.name} melakukan re-roll.`);
            diceEl.innerText = "🔄";
            setTimeout(() => {
                roll = Math.floor(Math.random() * 6) + 1;
                diceEl.innerText = roll;
                processTurn(roll);
            }, 600);
        }
        else {
            diceEl.innerText = roll;
            processTurn(roll);
        }
    }

    function processTurn(roll) {
        let attacker = gameState.turn === 1 ? gameState.p1 : gameState.p2;
        let defender = gameState.turn === 1 ? gameState.p2 : gameState.p1;
        let skillMati = (defender.id === 'alphadios' && attacker.hp < defender.hp);
        
        if (roll % 2 === 0) { 
            let dmg = 2;
            if (attacker.element === 'fire' && !skillMati) dmg = 3;
            
            if (attacker.id === 'zeron' && defender.hp < 5 && !skillMati) {
                dmg = 3;
                addLog(`Soul Devourer Aktif! Damage meningkat menjadi 3.`);
            }

            if (attacker.id === 'shiden' && attacker.hp <= 4 && !skillMati) {
                dmg += 1;
                addLog(`Burning Soul Aktif! +1 Damage Tambahan.`);
            }

            if (attacker.id === 'quake' && attacker.hp % 2 === 0 && !skillMati) {
                dmg += 1;
                addLog(`Overgrowth Aktif! HP Genap beri +1 Damage.`);
            }

            if (defender.element === 'light' && !skillMati) dmg = 1;
            if (defender.id === 'grist') dmg -= 1;
            
            if (defender.id === 'emrakul' && defender.abyssalShield && !skillMati) {
                dmg = Math.max(0, dmg - 1);
                addLog(`Abyssal Tide Aktif! Damage dikurangi.`);
                defender.abyssalShield = false; 
            }

            defender.hp = Math.max(0, defender.hp - dmg);
            addLog(`${attacker.name} Hit! -${dmg} HP`);

            if (defender.id === 'ulalek' && !defender.skillActive && dmg > 0) {
                defender.skillActive = true;
                addLog(`${defender.name} terkena damage! Gaze of the Void aktif kembali.`);
            }

            if (attacker.id === 'ulalek' && attacker.skillActive && !skillMati) {
                defender.skipTurn = true;
                attacker.skillActive = false;
                addLog(`Gaze of the Void! ${defender.name} Lumpuh (Skip 1 giliran).`);
            }

            if (defender.id === 'ryusei' && !skillMati) {
                attacker.dragonScaleDebuff = true;
                addLog(`Dragon's Scale terpicu! ${attacker.name} dipaksa meleset di turn depan.`);
            }
            
            if (attacker.id === 'alpharion' && !skillMati && defender.hp > 0) {
                updateUI();
                addLog(`Dual Wing Slash! ${attacker.name} menyerang lagi...`);
                setTimeout(() => {
                    let secondRoll = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('dice-display').innerText = secondRoll;

                    if (attacker.dragonScaleDebuff && !skillMati && secondRoll % 2 === 0) {
                        secondRoll = 1;
                        addLog(`Dragon's Scale: Serangan kedua dipaksa meleset!`);
                        attacker.dragonScaleDebuff = false;
                    }

                    if (secondRoll % 2 === 0) {
                        let bonusDmg = 3; 
                        if (defender.id === 'grist') bonusDmg -= 1;
                        if (defender.element === 'light') bonusDmg = 1;
                        
                        if (defender.id === 'emrakul' && defender.abyssalShield && !skillMati) {
                            bonusDmg = Math.max(0, bonusDmg - 1);
                            addLog(`Abyssal Tide Aktif!`);
                            defender.abyssalShield = false;
                        }

                        defender.hp = Math.max(0, defender.hp - bonusDmg);
                        addLog(`Genap lagi! Slash tambahan: -${bonusDmg} HP`);

                        if (defender.id === 'ulalek' && !defender.skillActive && bonusDmg > 0) {
                            defender.skillActive = true;
                            addLog(`${defender.name} terkena damage! Gaze of the Void aktif kembali.`);
                        }

                        if (defender.id === 'ryusei' && !skillMati) {
                            attacker.dragonScaleDebuff = true;
                        }
                    } else {
                        addLog(`Lemparan kedua ganjil.`);
                    }
                    updateUI();
                    finalizeTurn();
                }, 800);
                return; 
            }

            if (attacker.element === 'dark' && !skillMati) {
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + 1);
                addLog(`Vampiric! ${attacker.name} pulih 1 HP`);
            }
            if (attacker.id === 'dorballom' && !skillMati) {
                defender.maxHp = Math.max(1, defender.maxHp - 1);
                if(defender.hp > defender.maxHp) defender.hp = defender.maxHp;
                addLog(`Cursed Aura: Max HP lawan terpangkas!`);
            }
        } else { 
            if (attacker.id === 'bladewing' && attacker.hp > 1) {
                attacker.hp -= 1;
                defender.hp = Math.max(0, defender.hp - 2);
                addLog(`Overheat! ${attacker.name} paksa serangan (-1 HP Sendiri)`);
                if (defender.id === 'ulalek' && !defender.skillActive) {
                    defender.skillActive = true;
                    addLog(`${defender.name} terkena damage! Gaze of the Void aktif kembali.`);
                }
            } else {
                addLog(`${attacker.name} Miss.`);
                if (attacker.element === 'water' && !skillMati) {
                    attacker.hp = Math.min(attacker.maxHp, attacker.hp + 1);
                    addLog(`Purify! Pulih 1 HP`);
                    
                    if (attacker.id === 'emrakul') {
                        attacker.abyssalShield = true;
                        addLog(`Abyssal Tide Disiapkan!`);
                    }
                }
                if (defender.id === 'aesi' && !skillMati) {
                    attacker.hp = Math.max(0, attacker.hp - 1);
                    addLog(`Reflective: ${attacker.name} terpental 1 damage!`);
                    if (attacker.id === 'ulalek' && !attacker.skillActive) {
                        attacker.skillActive = true;
                        addLog(`${attacker.name} terkena damage! Gaze of the Void aktif kembali.`);
                    }
                }
            }
        }
        updateUI();
        finalizeTurn();
    }

    function checkReborn(target) {
        if (target.id === 'nekusar' && target.hp <= 0 && !target.rebornUsed) {
            target.hp = 4;
            target.rebornUsed = true;
            addLog(`⚡ NIGHT REBORN! ${target.name} bangkit kembali dengan 4 HP!`);
            updateUI();
            return true;
        }
        return false;
    }

    function finalizeTurn() {
        const p1Reborn = checkReborn(gameState.p1);
        const p2Reborn = checkReborn(gameState.p2);
        const delay = (p1Reborn || p2Reborn) ? 500 : 0;

        setTimeout(() => {
            if (gameState.p1.hp <= 0 || gameState.p2.hp <= 0) {
                let win = gameState.p1.hp > 0 ? gameState.p1.name : gameState.p2.name;
                alert(`${win} MENANG!`); location.reload();
            } else {
                gameState.turn = gameState.turn === 1 ? 2 : 1;
                gameState.isRolling = false;
                startNewTurn();
            }
        }, delay);
    }

    function startNewTurn() {
        let act = gameState.turn === 1 ? gameState.p1 : gameState.p2;
        let tar = gameState.turn === 1 ? gameState.p2 : gameState.p1;

        if (act.skipTurn) {
            addLog(`${act.name} masih Lumpuh! Giliran dilewati.`);
            act.skipTurn = false;
            gameState.turn = gameState.turn === 1 ? 2 : 1;
            startNewTurn();
            return;
        }

        document.getElementById('turn-indicator').innerText = `GILIRAN ${act.name}`;
        
        if (act.element === 'nature' && act.hp % 2 !== 0) {
            if (act.id === 'grist') {
                tar.hp = Math.max(0, tar.hp - 1);
                addLog(`Thorn Burst: HP Ganjil, musuh kena 1 damage!`);
                if (tar.id === 'ulalek' && !tar.skillActive) {
                    tar.skillActive = true;
                    addLog(`${tar.name} terkena damage! Gaze of the Void aktif kembali.`);
                }
            } else {
                act.hp = Math.min(act.maxHp, act.hp + 1);
                addLog(`Regrow: HP Ganjil, ${act.name} pulih 1 HP`);
            }
        }
        
        updateUI();
        
        if (gameState.p1.hp <= 0 || gameState.p2.hp <= 0) {
            let win = gameState.p1.hp > 0 ? gameState.p1.name : gameState.p2.name;
            alert(`${win} MENANG!`); location.reload();
            return;
        }

        if(gameState.mode === 'pve' && gameState.turn === 2) {
            document.getElementById('roll-btn').classList.add('hidden');
            setTimeout(handleRoll, 1000);
        } else {
            document.getElementById('roll-btn').classList.remove('hidden');
        }
    }

    function updateUI() {
        document.getElementById('p1-hp-fill').style.width = (gameState.p1.hp / 10 * 100) + "%";
        document.getElementById('p2-hp-fill').style.width = (gameState.p2.hp / 10 * 100) + "%";
        document.getElementById('p1-hp-text').innerText = `HP: ${gameState.p1.hp}/${gameState.p1.maxHp}`;
        document.getElementById('p2-hp-text').innerText = `HP: ${gameState.p2.hp}/${gameState.p2.maxHp}`;
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `<div>> ${msg}</div>` + log.innerHTML;
    }
</script>
</body>
