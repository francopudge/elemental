<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental</title>
    <style>
        /* CSS Dasar tetap sama */
        body {
            background-color: #0d0d0d;
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        } 

        .game-container {
            text-align: center;
            width: 95%; 
            max-width: 800px;
            background: #1a1a1a;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative; 
            box-sizing: border-box;
        }

        #loading-screen {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        } 

        .loading-text {
            font-size: 1.5em;
            color: #e67e22; 
            margin-top: 15px;
            font-weight: bold;
        }

        .screen { display: none; } 
        .active { display: block; } 

        .menu-list {
            display: flex;
            flex-direction: column; 
            gap: 15px;
            align-items: center;
            margin-top: 30px;
        }

        .pick-container {
            display: flex;
            justify-content: center; 
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pick-card {
            width: 180px;
            background: #252525; 
            border: 3px solid #444;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        } 

        .pick-card:hover {
            transform: translateY(-5px);
            border-color: #e67e22; 
        }

        .pick-card img {
            width: 100%;
            height: 180px; 
            object-fit: contain;
        }

        .battle-arena {
            display: flex;
            justify-content: space-around; 
            align-items: center;
            margin: 20px 0;
            gap: 10px;
        }

        .card {
            background: #252525;
            border: 4px solid #444; 
            border-radius: 12px;
            width: 220px;
            padding: 15px;
            transition: all 0.4s ease;
            box-sizing: border-box;
        } 

        .element-green { border-color: #2ecc71; box-shadow: 0 0 15px rgba(46, 204, 113, 0.3); } 
        .element-plague { border-color: #9b59b6; box-shadow: 0 0 15px rgba(155, 89, 182, 0.3); } 
        .element-progenitus { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.3); } 

        .hp-bar { background: #444; height: 15px; border-radius: 10px; overflow: hidden; margin: 10px 0; } 
        .hp-fill { background: #e74c3c; height: 100%; width: 100%; transition: width 0.3s ease; } 

        .char-img {
            width: 100%;
            height: 150px; 
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        } 
        .char-img img { width: 100%; height: 100%; object-fit: contain; } 

        .skill-box { font-size: 0.85em; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; text-align: left; min-height: 80px; } 

        button {
            padding: 12px 30px;
            font-size: 1.1em; 
            font-weight: bold;
            cursor: pointer;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px #d35400;
            margin: 5px;
        } 
        button:active { transform: translateY(2px); box-shadow: 0 2px #d35400; } 
        .btn-back { background: #7f8c8d; box-shadow: 0 4px #2c3e50; } 

        .log {
            margin-top: 20px;
            background: #000; 
            padding: 10px;
            height: 80px;
            overflow-y: auto;
            border: 1px solid #333;
            font-size: 0.9em;
            text-align: left;
        } 

        .rulebook-img { max-width: 300px; width: 100%; border-radius: 10px; margin: 10px auto; display: block; } 
        .shake { animation: shake 0.5s; } 
        @keyframes shake {
            0%, 100% { transform: translateX(0); } 
            25%, 75% { transform: translateX(-5px); } 
            50% { transform: translateX(5px); } 
        }

        .music-ctrl {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            padding: 8px 15px;
            font-size: 0.8em;
            background: #2c3e50;
            box-shadow: 0 3px #1a252f;
        }

        @media screen and (max-width: 600px) {
            .battle-arena { flex-direction: column; } 
            .card { width: 100%; } 
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <img src="rulebook.png" alt="Loading" class="rulebook-img">
    <div class="loading-text">MEMUAT: <span id="load-perc">0</span>%</div>
</div>

<div class="game-container">
    <button id="music-btn" class="music-ctrl" onclick="toggleMusic()">🎵 PLAY MUSIC</button>
    <audio id="bg-music" loop>
        <source src="運命は君の手に.mp3" type="audio/mpeg">
    </audio>

    <div id="screen-menu" class="screen">
        <h1 style="color: #d4af37;">ELEMENTAL</h1>
        <div class="menu-list">
            <button onclick="openPick('multiplayer')">MULTIPLAYER MODE (P1 vs P2)</button>
            <button onclick="openPick('ai')">VS AI (P1 vs AI)</button> 
            <button onclick="showScreen('screen-rules')">RULEBOOK</button>
        </div>
    </div>

    <div id="screen-pick" class="screen">
        <h2 id="pick-title">PILIH KARAKTER P1</h2>
        <div class="pick-container">
            <div id="pick-grist" class="pick-card" onclick="selectChar('grist')">
                <img src="grist.png" alt="Grist">
                <div style="font-weight:bold; color:#2ecc71;">GRIST</div> 
            </div>
            <div id="pick-prog" class="pick-card" onclick="selectChar('progenitus')">
                <img src="progenitus.png" alt="Progenitus">
                <div style="font-weight:bold; color:#f1c40f;">PROGENITUS</div> 
            </div>
        </div>
        <br>
        <button class="btn-back" onclick="showScreen('screen-menu')">KEMBALI</button>
    </div>

    <div id="screen-rules" class="screen">
        <h2>RULEBOOK</h2>
        <img src="rulebook.png" alt="Rulebook" class="rulebook-img">
        <div style="text-align: left; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;"> 
            <p>• <b>SISTEM PICK:</b> Pilih elemen untuk memulai pertarungan.</p>
            <p>• <b>EVOLUSI:</b> Grist akan berubah menjadi PLAGUE jika HP di bawah 50.</p>
        </div>
        <br>
        <button class="btn-back" onclick="showScreen('screen-menu')">KEMBALI</button>
    </div>

    <div id="screen-battle" class="screen">
        <h2 id="battle-title" style="color: #d4af37;">BATTLE</h2>
     
   <div class="battle-arena"> 
            <div id="player-card" class="card">
                <h2 id="char-name">GRIST</h2>
                <div class="hp-bar"><div id="p-hp-fill" class="hp-fill"></div></div>
                <p>HP: <span id="p-hp-text">100</span>/100</p>
                <div class="char-img"><img id="char-visual" src="grist.png" alt="CHAR"></div>
       
         <div class="skill-box"> 
                    <b id="skill-name">Skill</b><br>
                    <span id="skill-desc">Deskripsi</span>
                </div>
            </div>

            <div style="font-weight: bold; font-size: 1.5em;">VS</div> 

            <div id="enemy-card" class="card">
                <h2 id="enemy-char-name">ENEMY</h2>
                <div class="hp-bar"><div id="e-hp-fill" class="hp-fill"></div></div>
                <p>HP: <span id="e-hp-text">100</span>/100</p>
                <div id="enemy-visual-container" class="char-img"></div>
            
    <div class="skill-box"> 
                    <b id="enemy-skill-name">Skill</b><br>
                    <span id="enemy-skill-desc">Deskripsi</span>
                </div>
            </div>
        </div>

        <div class="controls">
     <button id="btn-attack" onclick="mulaiGiliran()">P1 SERANG (D20)</button> 
            <button id="btn-attack-p2" style="display:none;" onclick="mulaiGiliranP2()">P2 SERANG (D20)</button>
            <button id="btn-back-battle" class="btn-back" style="display:none;" onclick="resetGame()">BACK TO MENU</button>
            <div id="battle-log" class="log">Bersiaplah!</div>
        </div>
    </div>
</div>

<script>
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');

    function toggleMusic() {
        if (music.paused) {
            music.play();
            musicBtn.innerText = "⏸ PAUSE MUSIC";
        } else {
            music.pause();
            musicBtn.innerText = "🎵 PLAY MUSIC";
        }
    }

    window.addEventListener('load', () => {
        let perc = 0;
        const loadInterval = setInterval(() => { 
            perc += Math.floor(Math.random() * 10) + 1;
            if (perc >= 100) {
                perc = 100;
         clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none'; 
                    showScreen('screen-menu');
                }, 500);
            }
           document.getElementById('load-perc').innerText = perc;
        }, 100);
    });

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    } 

    let gameMode = 'ai';
    let activePlayer = 1;
    let player = {};
    let enemy = {}; 

    function openPick(mode) {
        gameMode = mode;
        document.getElementById('pick-title').innerText = "PILIH KARAKTER P1";
        showScreen('screen-pick');
    }

    function selectChar(type) {
        if(type === 'grist') {
            player = { name: "GRIST", hp: 100, maxHp: 100, charType: 'grist', transformed: false };
            enemy = { 
                name: (gameMode === 'ai' ? "AI PROGENITUS" : "P2 PROGENITUS"), 
                hp: 100, maxHp: 100, 
                charType: 'progenitus', 
                isAI: (gameMode === 'ai'),
                transformed: false 
            };
        } else {
            player = { name: "PROGENITUS", hp: 100, maxHp: 100, charType: 'progenitus', transformed: false };
            enemy = { 
                name: (gameMode === 'ai' ? "AI GRIST" : "P2 GRIST"), 
                hp: 100, maxHp: 100, 
                charType: 'grist', 
                isAI: (gameMode === 'ai'),
                transformed: false 
            };
        }
        startGame(gameMode);
    }

    function startGame(mode) {
        gameMode = mode;
        setupBattleUI();
        showScreen('screen-battle');
        addLog(`Battle Start: ${player.name} vs ${enemy.name}`); 
        activePlayer = 1;
        toggleControlButtons();
        updateUI();
    } 

    // Logika Perubahan Grist ke Plague (DIPERBAIKI: Menggunakan parameter prefix yang benar)
    function checkTransformation(entity, prefix) {
        if (entity.charType === 'grist' && entity.hp < 50 && !entity.transformed) {
            entity.transformed = true;
            entity.charType = 'plague'; 
            
            // Logika penamaan ulang
            if (prefix === 'p') {
                entity.name = "PLAGUE";
            } else {
                entity.name = (entity.isAI ? "AI " : "P2 ") + "PLAGUE";
            }
            
            addLog(`<b>WASPADA! ${entity.name} telah bangkit!</b>`); 
            setupBattleUI(); 
        }
    }

    function setupBattleUI() {
        document.getElementById('char-name').innerText = player.name;
        document.getElementById('player-card').className = `card element-${player.charType}`; 
        document.getElementById('char-visual').src = `${player.charType}.png`;
        
        // P1 Skills
        if (player.charType === 'grist') {
            document.getElementById('skill-name').innerText = "Chlorophyll Armor";
            document.getElementById('skill-desc').innerText = "Pulihkan 5 HP otomatis setiap giliran."; 
        } else if (player.charType === 'plague') {
            document.getElementById('skill-name').innerText = "Aura of Decay";
            document.getElementById('skill-desc').innerText = "Serap 5 HP lawan jika angka dadu ganjil.";
        } else if (player.charType === 'progenitus') { 
            document.getElementById('skill-name').innerText = "The Great Aegis";
            document.getElementById('skill-desc').innerText = "Pertahanan absolut sang dewa."; 
        }

        // Enemy Skills
        document.getElementById('enemy-char-name').innerText = enemy.name;
        document.getElementById('enemy-card').className = `card element-${enemy.charType}`; 
        document.getElementById('enemy-visual-container').innerHTML = `<img src="${enemy.charType}.png" alt="ENEMY">`; 
        
        if (enemy.charType === 'grist') {
            document.getElementById('enemy-skill-name').innerText = "Chlorophyll Armor";
            document.getElementById('enemy-skill-desc').innerText = "Pulihkan 5 HP otomatis setiap giliran."; 
        } else if (enemy.charType === 'plague') {
            document.getElementById('enemy-skill-name').innerText = "Aura of Decay";
            document.getElementById('enemy-skill-desc').innerText = "Serap 5 HP lawan jika angka dadu ganjil.";
        } else if (enemy.charType === 'progenitus') { 
            document.getElementById('enemy-skill-name').innerText = "The Great Aegis";
            document.getElementById('enemy-skill-desc').innerText = "Pertahanan absolut sang dewa."; 
        }
    }

    function updateUI() {
        // Cek transformasi SEBELUM update teks/visual (agar perubahan instan)
        checkTransformation(player, 'p');
        checkTransformation(enemy, 'e');

        document.getElementById('p-hp-text').innerText = player.hp;
        document.getElementById('e-hp-text').innerText = enemy.hp; 
        document.getElementById('p-hp-fill').style.width = (player.hp / player.maxHp * 100) + "%";
        document.getElementById('e-hp-fill').style.width = (enemy.hp / enemy.maxHp * 100) + "%"; 
    }

    function addLog(msg) {
        const logBox = document.getElementById('battle-log');
        logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML; 
    }

    async function mulaiGiliran() {
        if (gameMode === 'multiplayer' && activePlayer !== 1) return;
        document.getElementById('btn-attack').disabled = true; 
        
        let initialDamage = Math.floor(Math.random() * 20) + 1; 
        addLog(`${player.name} Roll: <b>${initialDamage}</b>`);

        // Cek Aura of Decay P1 (Sesudah Roll D20)
        if (player.charType === 'plague' && initialDamage % 2 !== 0) {
            enemy.hp = Math.max(0, enemy.hp - 5);
            player.hp = Math.min(player.hp + 5, player.maxHp); 
            addLog(`Aura of Decay menyerap HP!`);
        }
        
        // Cek Chlorophyll Armor P1
        if (player.charType === 'grist') player.hp = Math.min(player.hp + 5, player.maxHp);

        // Kalkulasi Damage D20
        let finalDamage = initialDamage;
        if (enemy.charType === 'progenitus') {
            finalDamage = Math.max(0, initialDamage - 5);
            addLog(`The Great Aegis mengurangi damage!`);
        }

        enemy.hp = Math.max(0, enemy.hp - finalDamage);
        document.getElementById('enemy-card').classList.add('shake');
        updateUI();
        
        setTimeout(() => document.getElementById('enemy-card').classList.remove('shake'), 500);
        if (enemy.hp <= 0) { 
            addLog(`<b>${player.name} MENANG!</b>`);
            endGame();
            return;
        } 

        await new Promise(r => setTimeout(r, 1000));
        if (enemy.isAI) mulaiGiliranAI();
        else { activePlayer = 2; toggleControlButtons(); } 
    }

    async function mulaiGiliranP2() {
        document.getElementById('btn-attack-p2').disabled = true;

        let initialDamage = Math.floor(Math.random() * 20) + 1;
        addLog(`${enemy.name} Roll: <b>${initialDamage}</b>`); 

        // Cek Aura of Decay P2 (Sesudah Roll D20)
        if (enemy.charType === 'plague' && initialDamage % 2 !== 0) {
            player.hp = Math.max(0, player.hp - 5);
            enemy.hp = Math.min(enemy.hp + 5, enemy.maxHp); 
            addLog(`Aura of Decay menyerap HP!`);
        }

        // Cek Chlorophyll Armor P2
        if (enemy.charType === 'grist') enemy.hp = Math.min(enemy.hp + 5, enemy.maxHp);

        // Kalkulasi Damage D20
        let finalDamage = initialDamage;
        if (player.charType === 'progenitus') {
            finalDamage = Math.max(0, initialDamage - 5);
            addLog(`The Great Aegis mengurangi damage!`);
        }

        player.hp = Math.max(0, player.hp - finalDamage);
        document.getElementById('player-card').classList.add('shake');
        updateUI();
        
        if (player.hp <= 0) { addLog(`<b>${enemy.name} MENANG!</b>`); endGame(); return; } 

        await new Promise(r => setTimeout(r, 1000));
        activePlayer = 1;
        toggleControlButtons();
    } 

    async function mulaiGiliranAI() {
        let initialDamage = Math.floor(Math.random() * 20) + 1;
        addLog(`AI Roll: <b>${initialDamage}</b>`);

        // Cek Aura of Decay AI (Sesudah Roll D20)
        if (enemy.charType === 'plague' && initialDamage % 2 !== 0) {
            player.hp = Math.max(0, player.hp - 5);
            enemy.hp = Math.min(enemy.hp + 5, enemy.maxHp); 
            addLog(`Aura of Decay menyerap HP!`);
        }

        // Cek Chlorophyll Armor AI
        if (enemy.charType === 'grist') enemy.hp = Math.min(enemy.hp + 5, enemy.maxHp);

        // Kalkulasi Damage D20
        let finalDamage = initialDamage;
        if (player.charType === 'progenitus') {
            finalDamage = Math.max(0, initialDamage - 5);
            addLog(`The Great Aegis mengurangi damage!`);
        }

        player.hp = Math.max(0, player.hp - finalDamage);
        updateUI();
        
        if (player.hp <= 0) { addLog("<b>KALAH!</b>"); endGame(); } 
        else document.getElementById('btn-attack').disabled = false;
    } 

    function toggleControlButtons() {
        const btnP1 = document.getElementById('btn-attack');
        const btnP2 = document.getElementById('btn-attack-p2'); 
        if (gameMode !== 'multiplayer') {
            btnP1.style.display = 'inline-block';
            btnP2.style.display = 'none'; 
            btnP1.disabled = false;
        } else {
            btnP1.style.display = (activePlayer === 1) ? 'inline-block' : 'none'; 
            btnP2.style.display = (activePlayer === 2) ? 'inline-block' : 'none';
            btnP1.disabled = false; btnP2.disabled = false;
        } 
    }

    function endGame() {
        document.getElementById('btn-attack').style.display = "none";
        document.getElementById('btn-attack-p2').style.display = "none"; 
        document.getElementById('btn-back-battle').style.display = "inline-block";
    }

    function resetGame() {
        location.reload();
    }
</script>
</body>
</html>
