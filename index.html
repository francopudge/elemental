<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Dice Duel</title>
    <link rel="icon" type="image/png" href="cover.png">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-gold: #f1c40f;
            --accent-purple: #8e44ad;
            --accent-blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: url('cover.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
            box-sizing: border-box;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('cover.png') no-repeat center center;
            background-size: contain;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
        }
        .loader {
            width: 80%;
            max-width: 200px; height: 8px;
            background: #333; border-radius: 5px; overflow: hidden; border: 1px solid #555;
        }
        .loader-fill {
            width: 0%;
            height: 100%; background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold); transition: width 0.3s;
        }

        #game-container {
            width: 100%;
            max-width: 800px; 
            background: rgba(15, 15, 15, 0.94);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,1);
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid #333;
            margin: auto;
        }

        .hidden { display: none !important; }

        .menu-btn {
            background: linear-gradient(to bottom, #444, #111);
            color: white; border: 2px solid #555;
            padding: 10px 15px; margin: 5px; cursor: pointer;
            font-size: 1em; border-radius: 8px; transition: 0.3s;
            min-width: 180px; font-weight: bold; text-transform: uppercase;
        }
        .menu-btn:hover:not(:disabled) { border-color: var(--accent-gold); color: var(--accent-gold);
        transform: scale(1.03); }
        .menu-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .arena { 
            display: flex;
            justify-content: space-between; 
            margin-top: 5px; padding: 10px;
            background-image: url('battle.png'); background-size: cover;
            background-position: center; border-radius: 12px; border: 2px solid #444;
            min-height: 250px;
            align-items: center;
            gap: 5px;
        }

        .player-side { 
            flex: 1;
            padding: 8px; background: rgba(0,0,0,0.7); 
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 40%;
        }

        /* Ukuran Gambar Battle Dioptimalkan untuk Mobile */
        .battle-img { 
            width: 100%;
            max-width: 120px;
            aspect-ratio: 63/88;
            object-fit: cover;
            filter: drop-shadow(0 0 8px black); 
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .hp-bar { 
            height: 18px;
            width: 100%; background-image: url('darah.png'); 
            background-size: cover; background-repeat: no-repeat;
            background-position: center; margin: 5px 0; position: relative; 
            border: 1px solid #555;
            overflow: hidden;
        }
        .hp-fill { 
            height: 100%;
            background: rgba(200, 0, 0, 0.7); width: 100%; 
            transition: width 0.6s; float: right; mix-blend-mode: multiply;
        }

        .dice-section {
            flex: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dice-box { font-size: 2.5em;
            color: var(--accent-gold); text-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }

        #log {
            height: 60px;
            overflow-y: auto; background: rgba(0,0,0,0.85);
            padding: 8px; text-align: left; font-size: 0.75em;
            margin-top: 10px; border-radius: 8px; border: 1px solid #444; color: #ccc;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            padding: 15px; border-radius: 10px;
            max-width: 90%; max-height: 90%; text-align: center;
            border: 2px solid var(--accent-gold);
        }
        .modal-content img { max-width: 100%; max-height: 70vh; border-radius: 5px; object-fit: contain; }

        /* --- Kartu Seleksi Karakter Mobile Friendly --- */
        #monster-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .char-card {
            background: linear-gradient(145deg, #1a1a1a, #252525);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .char-card:hover { transform: scale(1.02); border-color: #666; }
        .char-card.selected { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold); }
        .char-card.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .char-card.disabled::after {
            content: "DIPILIH";
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: rgba(255, 0, 0, 0.9); color: white;
            padding: 2px 8px; font-weight: bold; font-size: 0.7em; border-radius: 4px;
        }

        .monster-thumb { 
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 5px;
            background: rgba(0,0,0,0.3);
        }
        .skill-text {
            display: block;
            font-size: 0.65em; 
            color: #bbb;
            line-height: 1.2; 
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 4px;
            margin-top: 5px;
        }

        #music-control {
            position: fixed;
            top: 15px; right: 15px;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 50%;
            width: 40px; height: 40px;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.2em; }
            .menu-btn { min-width: 150px; font-size: 0.9em; }
            .battle-img { max-width: 90px; }
            #monster-list { grid-template-columns: 1fr 1fr; }
            .dice-box { font-size: 2em; }
            #turn-indicator { font-size: 0.8em; }
        }
    </style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="運命は君の手に.mp3" type="audio/mpeg">
</audio>

<button id="music-control" onclick="toggleMusic()" title="Play/Pause Music">
    <span id="music-icon">▶</span>
</button>

<div id="loading-screen">
    <h2 style="color:white; text-shadow: 2px 2px 4px #000; font-size: 1em;">Loading...</h2>
    <div class="loader"><div class="loader-fill" id="load-bar"></div></div>
</div>

<div id="rule-modal" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--accent-gold);">RULEBOOK</h3>
        <img src="rulebook.png" alt="Rulebook">
        <br>
        <button class="menu-btn" onclick="toggleRules()" style="min-width: 100px; margin-top:10px;">TUTUP</button>
    </div>
</div>

<div id="game-container" class="hidden">
 
    <div id="main-menu">
        <img src="cover.png" alt="Logo" style="width: 120px; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);">
        <h1 style="margin: 5px 0; letter-spacing: 1px;">ELEMENTAL DICE DUEL</h1>
        <div style="display: flex; flex-direction: column; align-items: center; margin-top: 15px;">
            <button class="menu-btn" onclick="startSelection('pvp')">Multiplayer</button>
            <button class="menu-btn" onclick="startSelection('pve')">VS AI</button>
            <button class="menu-btn" onclick="toggleRules()" style="background: linear-gradient(to bottom, #555, #222);">Rulebook</button>
        </div>
    </div>

    <div id="selection-screen" class="hidden">
        <h2 id="selection-title" style="font-size: 1.1em; margin: 5px 0;">Pilih Monster Pemain 1</h2>
        <div id="monster-list" style="max-height: 60vh; overflow-y: auto; margin-bottom: 10px; border: 1px solid #333; border-radius: 10px;"></div>
        <div style="display: flex; justify-content: center; gap: 8px;">
            <button class="menu-btn" style="background: linear-gradient(to bottom, #777, #333); min-width: 100px;" onclick="backToLobby()">Batal</button>
            <button class="menu-btn" id="confirm-btn" style="min-width: 100px;" onclick="confirmSelection()">Pilih</button>
        </div>
    </div>

    <div id="battle-screen" class="hidden">
        <div class="arena">
            <div class="player-side">
                <h4 id="p1-name" style="margin: 2px 0; font-size: 0.85em;">P1</h4>
                <div id="p1-monster-img-box"></div>
                <div class="hp-bar"><div id="p1-hp-fill" class="hp-fill"></div></div>
                <div id="p1-hp-text" style="font-size: 0.7em;">HP: 10/10</div>
            </div>

            <div class="dice-section">
                <div class="dice-box" id="dice-display">🎲</div>
                <h5 id="turn-indicator" style="margin: 5px 0; font-size: 0.7em;">GILIRAN P1</h5>
                <button class="menu-btn" id="roll-btn" onclick="handleRoll()" style="min-width: 70px; padding: 6px 10px; font-size: 0.8em;">ROLL!</button>
            </div>

            <div class="player-side">
                <h4 id="p2-name" style="margin: 2px 0; font-size: 0.85em;">P2</h4>
                <div id="p2-monster-img-box"></div>
                <div class="hp-bar"><div id="p2-hp-fill" class="hp-fill"></div></div>
                <div id="p2-hp-text" style="font-size: 0.7em;">HP: 10/10</div>
            </div>
        </div>
        <div id="log"></div>
    </div>
</div>

<script>
    /* --- Logic tetap sama dengan kode asli Anda --- */
    const music = document.getElementById('bg-music');
    const musicIcon = document.getElementById('music-icon');

    function toggleMusic() {
        if (music.paused) {
            music.play();
            musicIcon.innerText = "⏸";
        } else {
            music.pause();
            musicIcon.innerText = "▶";
        }
    }

    window.onload = () => {
        let progress = 0;
        const loadBar = document.getElementById('load-bar');
        const interval = setInterval(() => {
            progress += Math.random() * 25;
            if (progress > 100) progress = 100;
            loadBar.style.width = progress + '%';
            if(progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                }, 400);
            }
        }, 120);
    };

    function toggleRules() { 
        document.getElementById('rule-modal').classList.toggle('hidden');
    }

    const MONSTERS = [
        { 
            id: 'toxickrawler', 
            name: 'Toxic Krawler', 
            element: 'nature', 
            color: '#2ecc71', 
            img: 'toxickrawler.png', 
            skill: 'Corrosive: Jika musuh roll Genap, musuh kena 1 damage.' 
        },
        { 
            id: 'butcher', 
            name: 'Butcher', 
            element: 'dark', 
            color: '#8e44ad', 
            img: 'butcher.png', 
            skill: 'Hook: Jika musuh roll Ganjil, musuh kena 1 Damage.' 
        }
    ];

    let gameState = { mode: '', step: 0, p1: null, p2: null, turn: 1, isRolling: false, tempSelected: null };

    function backToLobby() {
        gameState.step = 0; gameState.p1 = null; gameState.p2 = null;
        gameState.tempSelected = null;
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function startSelection(mode) {
        gameState.mode = mode;
        gameState.step = 0; gameState.p1 = null; gameState.p2 = null;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
        document.getElementById('selection-title').innerText = "Pilih Monster Pemain 1";
        renderMonsters();
    }

    function renderMonsters() {
        const list = document.getElementById('monster-list');
        list.innerHTML = '';
        MONSTERS.forEach(m => {
            const isTaken = gameState.p1 && gameState.p1.id === m.id;
            const card = document.createElement('div');
            card.className = `char-card ${isTaken ? 'disabled' : ''}`;
            card.onclick = () => {
                if (isTaken) return;
                document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                gameState.tempSelected = m;
            };
            card.innerHTML = `
                <img src="${m.img}" class="monster-thumb" onerror="this.src='https://via.placeholder.com/150x150?text=Card'">
                <div style="font-weight:bold; font-size: 0.9em; color:${m.color}">${m.name}</div>
                <span class="skill-text">${m.skill}</span>
            `;
            list.appendChild(card);
        });
    }

    function confirmSelection() {
        if (!gameState.tempSelected) return alert("Pilih monster!");
        if (gameState.step === 0) {
            gameState.p1 = { ...gameState.tempSelected, hp: 10, maxHp: 10, skipTurn: false, skillActive: true };
            gameState.tempSelected = null;
            if (gameState.mode === 'pvp') {
                gameState.step = 1;
                document.getElementById('selection-title').innerText = "Pilih Monster Pemain 2";
                renderMonsters();
            } else {
                const available = MONSTERS.filter(m => m.id !== gameState.p1.id);
                gameState.p2 = { ...available[Math.floor(Math.random()*available.length)], hp: 10, maxHp: 10, skipTurn: false, skillActive: true };
                startBattle();
            }
        } else {
            gameState.p2 = { ...gameState.tempSelected, hp: 10, maxHp: 10, skipTurn: false, skillActive: true };
            startBattle();
        }
    }

    function startBattle() {
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.remove('hidden');
        document.getElementById('p1-name').innerText = gameState.p1.name;
        document.getElementById('p1-name').style.color = gameState.p1.color;
        document.getElementById('p1-monster-img-box').innerHTML = `<img src="${gameState.p1.img}" class="battle-img">`;
        document.getElementById('p2-name').innerText = gameState.p2.name;
        document.getElementById('p2-name').style.color = gameState.p2.color;
        document.getElementById('p2-monster-img-box').innerHTML = `<img src="${gameState.p2.img}" class="battle-img">`;
        updateUI();
    }

    function handleRoll() {
        if (gameState.isRolling) return;
        gameState.isRolling = true;
        const diceEl = document.getElementById('dice-display');
        diceEl.innerText = "🎲";

        setTimeout(() => {
            let roll = Math.floor(Math.random() * 6) + 1;
            diceEl.innerText = roll;
            processTurn(roll);
        }, 600);
    }

    function processTurn(roll) {
        let attacker = gameState.turn === 1 ? gameState.p1 : gameState.p2;
        let defender = gameState.turn === 1 ? gameState.p2 : gameState.p1;

        if (roll % 2 === 0) { 
            let dmg = 2;
            if (attacker.element === 'fire') dmg = 3;
            if (defender.element === 'light') dmg = 1;
            
            if (defender.id === 'toxickrawler') {
                attacker.hp = Math.max(0, attacker.hp - 1);
                addLog(`Corrosive! ${defender.name} counter 1 dmg.`);
            }

            defender.hp = Math.max(0, defender.hp - dmg);
            addLog(`${attacker.name} Hit! -${dmg} HP`);

            if (attacker.element === 'dark') {
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + 1);
                addLog(`Vampiric! ${attacker.name} +1 HP`);
            }
        } else { 
            addLog(`${attacker.name} Miss.`);

            if (defender.id === 'butcher') {
                attacker.hp = Math.max(0, attacker.hp - 1);
                addLog(`Hook! ${attacker.name} kena 1 dmg.`);
            }

            if (attacker.element === 'water') {
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + 1);
                addLog(`Purify! +1 HP`);
            }
        }
        updateUI();
        finalizeTurn();
    }

    function finalizeTurn() {
        setTimeout(() => {
            if (gameState.p1.hp <= 0 || gameState.p2.hp <= 0) {
                let win = gameState.p1.hp > 0 ? gameState.p1.name : gameState.p2.name;
                alert(`${win} MENANG!`); location.reload();
            } else {
                gameState.turn = gameState.turn === 1 ? 2 : 1;
                gameState.isRolling = false;
                startNewTurn();
            }
        }, 500);
    }

    function startNewTurn() {
        let act = gameState.turn === 1 ? gameState.p1 : gameState.p2;
        document.getElementById('turn-indicator').innerText = `GILIRAN ${act.name}`;
        
        if (act.element === 'nature' && act.hp % 2 !== 0) {
            act.hp = Math.min(act.maxHp, act.hp + 1);
            addLog(`Regrow: ${act.name} +1 HP`);
        }
        
        updateUI();

        if(gameState.mode === 'pve' && gameState.turn === 2) {
            document.getElementById('roll-btn').classList.add('hidden');
            setTimeout(handleRoll, 1000);
        } else {
            document.getElementById('roll-btn').classList.remove('hidden');
        }
    }

    function updateUI() {
        document.getElementById('p1-hp-fill').style.width = (gameState.p1.hp / 10 * 100) + "%";
        document.getElementById('p2-hp-fill').style.width = (gameState.p2.hp / 10 * 100) + "%";
        document.getElementById('p1-hp-text').innerText = `HP: ${gameState.p1.hp}/${gameState.p1.maxHp}`;
        document.getElementById('p2-hp-text').innerText = `HP: ${gameState.p2.hp}/${gameState.p2.maxHp}`;
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = `<div>> ${msg}</div>` + log.innerHTML;
    }
</script>
</body>
</html>
